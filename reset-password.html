<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ustaw nowe hasło</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: #f5f5f5;
      color: #412402;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .container {
      width: 100%;
      max-width: 420px;
      padding: 2rem;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .icon {
      margin-bottom: 1rem;
      text-align: center;
      font-size: 48px;
    }
    h1 {
      margin-bottom: 0.5rem;
      text-align: center;
      font-size: 22px;
    }
    p {
      margin-bottom: 1rem;
      color: #666;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }
    .fg {
      margin-bottom: 0.9rem;
    }
    label {
      display: block;
      margin-bottom: 0.35rem;
      color: #5b3610;
      font-size: 13px;
      font-weight: 700;
    }
    input {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d9c9b5;
      border-radius: 8px;
      font: inherit;
      outline: none;
    }
    input:focus {
      border-color: #BA7517;
      box-shadow: 0 0 0 3px rgba(186,117,23,0.14);
    }
    button,
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 42px;
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #BA7517;
      color: #fff;
      font: inherit;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    button:hover,
    a:hover {
      background: #854F0B;
    }
    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
    }
    .msg {
      display: none;
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      font-size: 13px;
      line-height: 1.45;
    }
    .msg.loading {
      display: block;
      background: #E6F1FB;
      color: #0C447C;
    }
    .msg.success {
      display: block;
      background: #EAF3DE;
      color: #27500A;
    }
    .msg.error {
      display: block;
      background: #FCEBEB;
      color: #A32D2D;
    }
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.45);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 8px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="icon" id="icon">🔐</div>
    <h1 id="title">Ustaw nowe hasło</h1>
    <p id="lead">Wpisz nowe hasło do swojego konta.</p>
    <div id="message" class="msg"></div>
    <form id="reset-form">
      <div class="fg">
        <label for="new-password">Nowe hasło</label>
        <input type="password" id="new-password" autocomplete="new-password" minlength="6" required>
      </div>
      <div class="fg">
        <label for="repeat-password">Powtórz hasło</label>
        <input type="password" id="repeat-password" autocomplete="new-password" minlength="6" required>
      </div>
      <button type="submit" id="save-btn">Zapisz nowe hasło</button>
    </form>
    <a href="/" id="home-link" class="hidden">Przejdź do strony głównej</a>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script>
    const SB_URL = 'https://fzjvrjowptibysaythwa.supabase.co';
    const SB_KEY = 'sb_publishable_IwEk9ePTdCzXivBHz8Gjcw_6iURm6p_';
    const sb = supabase.createClient(SB_URL, SB_KEY);

    const form = document.getElementById('reset-form');
    const btn = document.getElementById('save-btn');
    const msg = document.getElementById('message');
    const title = document.getElementById('title');
    const lead = document.getElementById('lead');
    const icon = document.getElementById('icon');
    const homeLink = document.getElementById('home-link');

    function getUrlParams() {
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const queryParams = new URLSearchParams(window.location.search);
      return {
        accessToken: hashParams.get('access_token') || queryParams.get('access_token'),
        refreshToken: hashParams.get('refresh_token') || queryParams.get('refresh_token'),
        type: hashParams.get('type') || queryParams.get('type'),
        error: hashParams.get('error_description') || queryParams.get('error_description')
      };
    }

    function showMessage(text, type) {
      msg.className = `msg ${type}`;
      msg.textContent = text;
    }

    function finishSuccess() {
      icon.textContent = '✅';
      title.textContent = 'Hasło zmienione';
      lead.textContent = 'Możesz teraz zalogować się nowym hasłem.';
      form.classList.add('hidden');
      homeLink.classList.remove('hidden');
      setTimeout(() => {
        window.location.href = '/';
      }, 3000);
    }

    async function prepareRecoverySession() {
      const params = getUrlParams();
      if (params.error) {
        throw new Error(params.error);
      }
      if (params.type && params.type !== 'recovery') {
        throw new Error('Ten link nie jest linkiem do resetowania hasła.');
      }
      if (params.accessToken && params.refreshToken) {
        const { error } = await sb.auth.setSession({
          access_token: params.accessToken,
          refresh_token: params.refreshToken
        });
        if (error) throw error;
      }
      const { data: { session } } = await sb.auth.getSession();
      if (!session) {
        throw new Error('Link wygasł albo jest nieprawidłowy. Poproś o nowy reset hasła.');
      }
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = document.getElementById('new-password').value;
      const repeat = document.getElementById('repeat-password').value;

      if (password.length < 6) {
        showMessage('Hasło musi mieć co najmniej 6 znaków.', 'error');
        return;
      }
      if (password !== repeat) {
        showMessage('Hasła muszą być takie same.', 'error');
        return;
      }

      btn.innerHTML = '<span class="spinner"></span>Zapisuję...';
      btn.disabled = true;
      const { error } = await sb.auth.updateUser({ password });
      btn.textContent = 'Zapisz nowe hasło';
      btn.disabled = false;

      if (error) {
        showMessage('Nie udało się zmienić hasła: ' + error.message, 'error');
        return;
      }

      showMessage('Hasło zostało zapisane.', 'success');
      await sb.auth.signOut();
      finishSuccess();
    });

    prepareRecoverySession().catch((err) => {
      icon.textContent = '❌';
      title.textContent = 'Nieprawidłowy link';
      lead.textContent = 'Nie można rozpocząć resetowania hasła.';
      form.classList.add('hidden');
      homeLink.classList.remove('hidden');
      showMessage(err.message || 'Spróbuj ponownie wysłać link resetujący.', 'error');
    });
  </script>
</body>
</html>
